name: fno-list
on:
  schedule:
    - cron: "17 2 * * 1-5"      # हर कारोबारी दिन 07:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/update_fno.py"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - run: python tools/update_fno.py
      - name: commit if changed
        run: |
          git config user.name "fno-bot"
          git config user.email "fno-bot@users.noreply.github.com"
          git add data/fno_list.json
          git diff --cached --quiet && exit 0
          git commit -m "data: NSE F&O list update"
          git pull --rebase origin main
          git push origin main
