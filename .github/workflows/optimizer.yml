name: optimizer
on:
  push:
    paths:
      - "tools/run_optimizer.py"
      - ".github/workflows/optimizer.yml"
      - "tools/RUN"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt tabulate
      - run: python tools/run_optimizer.py
      - name: save results to branch optimizer-results
        run: |
          git config user.name "optimizer-bot"
          git config user.email "optimizer-bot@users.noreply.github.com"
          git fetch origin optimizer-results || true
          mkdir -p /tmp/res && cp -r results/* /tmp/res/
          git checkout -B optimizer-results
          git rm -rq --cached . || true
          rm -rf results && mkdir -p results && cp -r /tmp/res/* results/
          git add -f results
          git commit -m "optimizer results ${GITHUB_SHA::7}" || true
          git push -f origin optimizer-results
