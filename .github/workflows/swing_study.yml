name: swing-study
on:
  push:
    branches: [swing-study]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: python tools/swing_study.py
      - name: save results to branch swing-results
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          mkdir -p /tmp/res && cp -r results/* /tmp/res/
          git checkout --orphan swing-results
          git rm -rq --cached . || true
          rm -rf results && mkdir -p results && cp -r /tmp/res/* results/
          git add -f results
          git commit -m "swing study results ${GITHUB_SHA::7}"
          git push -f origin swing-results
