name: zone-debug
on:
  push:
    branches: [zone-debug]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python tools/zone_debug.py "PGEL:3m,BANKNIFTY:10m,POWERGRID:15m,BLUESTARCO:30m"
      - name: save
        run: |
          git config user.name "debug-bot"; git config user.email "debug-bot@users.noreply.github.com"
          mkdir -p /tmp/res && cp results/zone_debug.md /tmp/res/
          git checkout --orphan debug-results
          git rm -rq --cached . || true
          mkdir -p results && cp /tmp/res/zone_debug.md results/
          git add -f results/zone_debug.md
          git commit -m "zone debug ${GITHUB_SHA::7}"
          git push -f origin debug-results
