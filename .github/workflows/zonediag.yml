name: zone-diag
on:
  push:
    branches: [zone-diag]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python tools/zone_diag.py
      - name: save
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          cp results/zone_diag.md /tmp/zd.md
          git checkout --orphan zone-diag-results
          git rm -rq --cached . || true
          mkdir -p results && cp /tmp/zd.md results/zone_diag.md
          git add -f results/zone_diag.md
          git commit -m "zone diag ${GITHUB_SHA::7}"
          git push -f origin zone-diag-results
